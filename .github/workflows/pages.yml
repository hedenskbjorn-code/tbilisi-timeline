name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # the checks of the data and of the texts stop the deploy when a translation is missing, a Georgian text is not Georgian,
  # a file of the page is missing or a unit test fails (tests/)
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/check_data.mjs
      - run: node --test tests/*.test.mjs
  # the tests of the browser (tests/e2e): the pages open without errors, the layers, the search, the cards, the budgets of the first screen;
  # the Chrome of the runner is used (playwright-core downloads no browser)
  e2e:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: echo "CHROME_PATH=$(which google-chrome)" >> "$GITHUB_ENV"
      - run: npm run test:e2e
  # only the main branch is published (a run on another branch checks and tests, nothing more)
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [checks, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # deploy-pages looks the artifact up through the API about a second after the upload and sometimes finds none ("Found 0 artifact(s)": it failed on
      # 2026-11-21 on three runs in a row, the artifact was there). A short pause before the deploy.
      - name: Wait until the artifact is listed
        run: sleep 30
      - id: deployment
        uses: actions/deploy-pages@v4
